name: CRN Computo - build Windows

on:
  push:
    branches:
      - "**"
    paths:
      - "computo/**"
      - ".github/workflows/computo-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: computo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Crea eseguibile
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name CRNComputo --icon assets\computo.ico
          --add-data "assets;assets"
          --collect-submodules keyring
          main.py

      - name: Diagnosi dell'uscita (fasi e modi di uscita)
        continue-on-error: true
        run: |
          foreach ($f in 1, 2, 3, 4, 99) {
            foreach ($u in "terminate", "exit") {
              $out = "$env:RUNNER_TEMP\diag_${f}_${u}.txt"
              $p = Start-Process -FilePath dist\CRNComputo\CRNComputo.exe -ArgumentList "--selftest", "`"$out`"", "--fase", "$f", "--uscita", $u -PassThru
              $null = $p.Handle
              $t0 = Get-Date
              if ($p.WaitForExit(60000)) { $code = $p.ExitCode } else { $p.Kill(); $code = "BLOCCATO" }
              $secs = [int]((Get-Date) - $t0).TotalSeconds
              $last = if (Test-Path $out) { (Get-Content $out | Select-Object -Last 3) -join " | " } else { "nessun rapporto" }
              "fase $f, uscita ${u}: $code dopo $secs s  [$last]"
            }
          }
          Get-Process CRNComputo -ErrorAction SilentlyContinue | Format-Table Id, StartTime

      - name: Collaudo dell'eseguibile
        run: |
          $out = "$env:RUNNER_TEMP\selftest_computo.txt"
          $p = Start-Process -FilePath dist\CRNComputo\CRNComputo.exe -ArgumentList "--selftest", "`"$out`"" -PassThru
          $null = $p.Handle   # senza questo ExitCode resta vuoto se il processo termina in fretta
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            if (Test-Path $out) { Get-Content $out }
            throw "Collaudo bloccato: l'ultimo passo riuscito è quello sopra"
          }
          $p.WaitForExit()
          $report = Get-Content $out -Raw
          $report
          if ($p.ExitCode -ne 0 -or $report -notmatch "ESITO: OK") { throw "Collaudo dell'eseguibile non riuscito (codice $($p.ExitCode))" }

      - name: Pacchetto portabile
        run: |
          $v = python -c "import crncomputo; print(crncomputo.__version__)"
          Compress-Archive -Path dist\CRNComputo\* -DestinationPath "dist\CRNComputo-portabile-$v.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CRNComputo-portable
          path: computo/dist/CRNComputo-portabile-*.zip
