name: CRN PDF Studio - build Windows

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "pdf_studio/**"
      - ".github/workflows/pdf-studio-windows.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una GitHub Release con installer e versione portabile"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf_studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Installa Ghostscript (per PDF/A)
        run: choco install ghostscript --no-progress -y

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $gs = Get-ChildItem "$env:ProgramFiles\gs\gs*\bin" | Select-Object -First 1
          $env:PATH = "$($gs.FullName);$env:PATH"
          python -m pytest -q tests

      - name: Test stampante virtuale
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\install_printer.ps1
          Get-Printer -Name "CRN PDF" | Format-List Name,DriverName,PortName
          "Prova di stampa CRN PDF Studio" | Out-Printer -Name "CRN PDF"
          $port = Join-Path $env:ProgramData "CRN PDF Studio\spool\stampa.pdf"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $port); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          python -c "import sys, pymupdf; from pdfstudio import printer as P; p = sys.argv[1]; ok = P.is_complete_pdf(p); t = pymupdf.open(p)[0].get_text() if ok else ''; print('PDF completo:', ok, '| testo:', t.strip()); sys.exit(0 if 'Prova di stampa' in t else 1)" "$port"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\uninstall_printer.ps1

      - name: Crea eseguibile
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name CRNPDFStudio --icon assets\pdfstudio.ico
          --add-data "assets;assets"
          --collect-submodules keyring
          --collect-data ezdxf
          main.py

      - name: Includi Ghostscript
        run: |
          $gsroot = (Get-ChildItem "$env:ProgramFiles\gs\gs*" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force dist\CRNPDFStudio\ghostscript | Out-Null
          Copy-Item -Recurse "$gsroot\bin" dist\CRNPDFStudio\ghostscript\bin
          Copy-Item -Recurse "$gsroot\lib" dist\CRNPDFStudio\ghostscript\lib
          if (Test-Path "$gsroot\iccprofiles") { Copy-Item -Recurse "$gsroot\iccprofiles" dist\CRNPDFStudio\ghostscript\iccprofiles }
          Copy-Item "$gsroot\doc\COPYING" dist\CRNPDFStudio\ghostscript\ -ErrorAction SilentlyContinue

      - name: Includi script della stampante
        run: Copy-Item -Recurse tools dist\CRNPDFStudio\tools

      - name: Verifica eseguibile (PDF/A con Ghostscript incluso)
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          dist\CRNPDFStudio\ghostscript\bin\gswin64c.exe -v

      - name: Crea installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Pacchetto portabile
        id: pkg
        run: |
          $v = python -c "import pdfstudio; print(pdfstudio.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path dist\CRNPDFStudio\* -DestinationPath "dist\CRNPDFStudio-portabile-$v.zip"

      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CRN PDF Studio ${{ steps.pkg.outputs.version }}
          body_path: pdf_studio/RELEASE_NOTES.md
          files: |
            pdf_studio/dist/CRNPDFStudio-Setup-*.exe
            pdf_studio/dist/CRNPDFStudio-portabile-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CRNPDFStudio-portable
          path: pdf_studio/dist/CRNPDFStudio

      - uses: actions/upload-artifact@v4
        with:
          name: CRNPDFStudio-Setup
          path: pdf_studio/dist/CRNPDFStudio-Setup-*.exe

  pdfa-validation:
    # Valida i PDF/A prodotti con veraPDF, il validatore di riferimento
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf_studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa dipendenze
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ghostscript
          pip install PyMuPDF asn1crypto cryptography

      - name: Crea file PDF/A di prova
        run: python tests/make_pdfa_samples.py "$RUNNER_TEMP/pdfa"

      - name: Installa veraPDF
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o verapdf.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q verapdf.zip
          cat > auto-install.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>VERAPDF_DIR</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          sed -i "s#VERAPDF_DIR#$RUNNER_TEMP/verapdf#" auto-install.xml
          java -jar verapdf-greenfield-*/verapdf-izpack-installer-*.jar auto-install.xml

      - name: Valida con veraPDF
        run: |
          status=0
          for f in "$RUNNER_TEMP"/pdfa/*.pdf; do
            out=$("$RUNNER_TEMP/verapdf/verapdf" --format text "$f" || true)
            echo "$out"
            echo "$out" | grep -q '^PASS' || status=1
          done
          if [ $status -ne 0 ]; then
            for f in "$RUNNER_TEMP"/pdfa/*.pdf; do "$RUNNER_TEMP/verapdf/verapdf" --format text -v "$f" | head -60 || true; done
          fi
          exit $status
