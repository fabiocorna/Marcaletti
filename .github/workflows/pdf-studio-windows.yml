name: PDF Studio - build Windows

on:
  push:
    paths:
      - "pdf_studio/**"
      - ".github/workflows/pdf-studio-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf_studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q tests

      - name: Crea eseguibile
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name PDFStudio --icon assets\pdfstudio.ico
          --add-data "assets;assets" main.py

      - name: Crea installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PDFStudio-portable
          path: pdf_studio/dist/PDFStudio

      - uses: actions/upload-artifact@v4
        with:
          name: PDFStudio-Setup
          path: pdf_studio/dist/PDFStudio-Setup-*.exe
