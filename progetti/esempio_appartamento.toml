nome = "Portafinestra legno doppio vetro 90x240"
larghezza = 0.90
altezza = 2.40
vetro = "doppio"
telaio = "legno"

# ---------- ponti termici (psi da abaco / calcolo, riferiti alle dimensioni esterne) ----------
[[ponti]]
id = "PT_SOLAIO"
nome = "Parete - solaio interpiano (non isolato)"
psi = 0.60

[[ponti]]
