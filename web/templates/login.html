{% extends "base.html" %}
{% block titolo %}Accesso{% endblock %}
{% block corpo %}
<section class="carta stretta">
  <h1>Accesso</h1>
  {% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
  <form method="post" action="/login" class="modulo">
    <label>Utente <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primario">Entra</button>
  </form>
</section>
{% endblock %}
